[package]
name = "datafusion-functions-aggregate"
description = "Traits and types for logical plans and expressions for DataFusion query engine"
keywords = ["datafusion", "logical", "plan", "expressions"]
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_functions_aggregate"

[dependencies]
arrow = { workspace = true }
arrow-select = { workspace = true }
datafusion-common = { workspace = true }
datafusion-doc = { workspace = true }
datafusion-execution = { workspace = true }
datafusion-expr = { workspace = true }
datafusion-functions-aggregate-common = { workspace = true }
datafusion-macros = { workspace = true }
datafusion-physical-expr = { workspace = true }
datafusion-physical-expr-common = { workspace = true }
half = { workspace = true }
hashbrown = { workspace = true }
itertools = { workspace = true }
log = { workspace = true }
num-traits = { workspace = true }

[dev-dependencies]
arrow = { workspace = true, features = ["test_utils"] }
criterion = { workspace = true }
rand = { workspace = true }

[[bench]]
name = "count"
harness = false

[[bench]]
name = "sum"
harness = false

[[bench]]
name = "array_agg"
harness = false

[[bench]]
harness = false
name = "min_max_bytes"

[[bench]]
name = "approx_distinct"
harness = false

[[bench]]
name = "first_last"
harness = false

[[bench]]
name = "count_distinct"
harness = false

[[bench]]
name = "median"
harness = false

[[bench]]
name = "nth_value"
harness = false

[[bench]]
name = "percentile_cont"
harness = false

[[bench]]
name = "sliding_max"
harness = false

[[bench]]
name = "variance"
harness = false

[features]
force_hash_collisions = ["datafusion-common/force_hash_collisions"]
