[package]
name = "datafusion-physical-expr-common"
description = "Common functionality of physical expression for DataFusion query engine"
keywords = ["arrow", "query", "sql"]
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_physical_expr_common"

[features]
default = []
# Enables the `PhysicalExpr::to_proto` hook used by `datafusion-proto`.
# Off by default so crates that never serialize plans pay nothing.
proto = ["dep:datafusion-proto-models"]
# Test-only: makes every value hash to the same bucket, so that code paths
# which only run on a hash collision are reachable in tests.
force_hash_collisions = ["datafusion-common/force_hash_collisions"]

[dependencies]
arrow = { workspace = true }
chrono = { workspace = true }
datafusion-common = { workspace = true }
datafusion-expr-common = { workspace = true }
datafusion-proto-models = { workspace = true, optional = true }
hashbrown = { workspace = true }
indexmap = { workspace = true }
itertools = { workspace = true }
parking_lot = { workspace = true }
pin-project = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
rand = { workspace = true }

[[bench]]
harness = false
name = "compare_nested"

[[bench]]
harness = false
name = "arrow_bytes_map"
