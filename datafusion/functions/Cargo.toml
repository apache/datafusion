[package]
name = "datafusion-functions"
description = "Function packages for the DataFusion query engine"
keywords = ["datafusion", "logical", "plan", "expressions"]
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[features]
crypto_expressions = ["md-5", "sha2", "blake2", "blake3"]
# enable datetime functions
datetime_expressions = ["chrono-tz"]
# Enable encoding by default so the doctests work. In general don't automatically enable all packages.
default = [
    "datetime_expressions",
    "encoding_expressions",
    "math_expressions",
    "regex_expressions",
    "string_expressions",
    "unicode_expressions",
]
# enable encode/decode functions
encoding_expressions = ["base64", "hex"]
# enable math functions
math_expressions = []
# enable regular expressions
regex_expressions = ["regex"]
# enable string functions
string_expressions = ["uuid"]
# enable unicode functions
unicode_expressions = []

[lib]
name = "datafusion_functions"

[dependencies]
arrow = { workspace = true }
arrow-buffer = { workspace = true }
base64 = { version = "0.23", optional = true }
blake2 = { version = "^0.11.0", optional = true }
blake3 = { version = "1.8", optional = true }
chrono = { workspace = true }
chrono-tz = { version = "0.10.4", optional = true }
datafusion-common = { workspace = true }
datafusion-doc = { workspace = true }
datafusion-execution = { workspace = true }
datafusion-expr = { workspace = true }
datafusion-expr-common = { workspace = true }
datafusion-macros = { workspace = true }
datafusion-physical-expr-common = { workspace = true }
hex = { workspace = true, optional = true }
itertools = { workspace = true }
log = { workspace = true }
md-5 = { version = "^0.11.0", optional = true }
memchr = { workspace = true }
num-traits = { workspace = true }
rand = { workspace = true }
regex = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"], optional = true }

[dev-dependencies]
arrow = { workspace = true, features = ["test_utils"] }
criterion = { workspace = true }
ctor = { workspace = true }
env_logger = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "sync"] }

[[bench]]
harness = false
name = "datetime_expressions"
required-features = ["datetime_expressions"]

[[bench]]
harness = false
name = "math_expressions"
required-features = ["math_expressions"]

[[bench]]
harness = false
name = "misc"
required-features = []

[[bench]]
harness = false
name = "regex_expressions"
required-features = ["regex_expressions"]

[[bench]]
harness = false
name = "string_expressions"
required-features = ["string_expressions"]

[[bench]]
harness = false
name = "unicode_expressions"
required-features = ["unicode_expressions"]

[[bench]]
harness = false
name = "crypto"
required-features = ["crypto_expressions"]

[[bench]]
harness = false
name = "dictionary_encoding"
required-features = ["string_expressions", "unicode_expressions"]

[[bench]]
harness = false
name = "encoding"
required-features = ["encoding_expressions"]
