[package]
name = "datafusion-proto-models"
description = "Protobuf-generated model types for DataFusion logical and physical plans"
keywords = ["arrow", "query", "sql"]
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_proto_models"

[features]
default = []
json = ["serde", "pbjson", "datafusion-proto-common/json"]

[dependencies]
datafusion-common = { workspace = true }
datafusion-proto-common = { workspace = true }
pbjson = { workspace = true, optional = true }
prost = { workspace = true }
serde = { version = "1.0", optional = true }

[dev-dependencies]
serde_json = { workspace = true }
