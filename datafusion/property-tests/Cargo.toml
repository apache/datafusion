[package]
name = "datafusion-property-tests"
description = "Property tests that validate implementations of DataFusion extension points, such as ExecutionPlan, against their contracts"
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_property_tests"

[features]
# Also run the built-in physical plan audit on `Profile::extended`, with its
# own snapshots
extended_tests = []

[dependencies]
arrow = { workspace = true }
datafusion-common = { workspace = true, default-features = true }
datafusion-execution = { workspace = true }
datafusion-physical-expr = { workspace = true }
datafusion-physical-plan = { workspace = true }
futures = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[dev-dependencies]
async-trait = { workspace = true }
# For the plans defined outside `datafusion-physical-plan`: data sources and
# sinks, `MemTable` DML (which needs a `SessionState`) and the optimizer's
# `OutputRequirementExec`
datafusion = { workspace = true, features = ["parquet"] }
datafusion-catalog = { workspace = true }
datafusion-datasource = { workspace = true }
datafusion-expr = { workspace = true }
datafusion-ffi = { workspace = true }
datafusion-functions-aggregate = { workspace = true }
datafusion-functions-window = { workspace = true }
insta = { workspace = true }
parking_lot = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
