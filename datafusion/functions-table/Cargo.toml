[package]
name = "datafusion-functions-table"
description = "Traits and types for logical plans and expressions for DataFusion query engine"
keywords = ["datafusion", "logical", "plan", "expressions"]
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_functions_table"

[features]
proto = [
    "dep:datafusion-proto-common",
    "dep:datafusion-proto-models",
    "datafusion-physical-plan/proto",
]

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
datafusion-catalog = { workspace = true }
datafusion-common = { workspace = true }
datafusion-expr = { workspace = true }
datafusion-physical-expr = { workspace = true }
datafusion-physical-plan = { workspace = true }
datafusion-proto-common = { workspace = true, optional = true }
datafusion-proto-models = { workspace = true, optional = true }
parking_lot = { workspace = true }

[dev-dependencies]
arrow = { workspace = true, features = ["test_utils"] }
