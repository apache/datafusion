[package]
name = "datafusion-proto"
description = "Protobuf serialization of DataFusion logical plan expressions"
keywords = ["arrow", "query", "sql"]
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_proto"

[features]
default = ["parquet"]
recursive_protection = ["dep:recursive"]
json = [
    "serde_json",
    "datafusion-proto-common/json",
    "datafusion-proto-models/json",
]
parquet = ["datafusion-datasource-parquet", "datafusion-common/parquet", "datafusion/parquet"]
avro = ["datafusion-datasource-avro"]

# Note to developers: do *not* add `datafusion` as a dependency in
# this crate. See https://github.com/apache/datafusion/issues/17713
# for additional information.

[dependencies]
arrow = { workspace = true }
datafusion-catalog = { workspace = true }
datafusion-catalog-listing = { workspace = true }
datafusion-common = { workspace = true }
datafusion-datasource = { workspace = true, features = ["proto"] }
datafusion-datasource-arrow = { workspace = true, features = ["proto"] }
datafusion-datasource-avro = { workspace = true, optional = true, features = ["proto"] }
datafusion-datasource-csv = { workspace = true, features = ["proto"] }
datafusion-datasource-json = { workspace = true, features = ["proto"] }
datafusion-datasource-parquet = { workspace = true, optional = true, features = ["proto"] }
datafusion-execution = { workspace = true }
datafusion-expr = { workspace = true, features = ["proto"] }
datafusion-functions-table = { workspace = true, features = ["proto"] }
datafusion-physical-expr = { workspace = true, features = ["proto"] }
datafusion-physical-expr-common = { workspace = true, features = ["proto"] }
datafusion-physical-plan = { workspace = true, features = ["proto"] }
datafusion-proto-common = { workspace = true }
datafusion-proto-models = { workspace = true }
object_store = { workspace = true }
prost = { workspace = true }
recursive = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
async-trait = { workspace = true }
datafusion = { workspace = true, default-features = false, features = [
    "sql",
    "compression",
    "datetime_expressions",
    "nested_expressions",
    "unicode_expressions",
] }
datafusion-functions = { workspace = true, default-features = true }
datafusion-functions-aggregate = { workspace = true }
datafusion-functions-window-common = { workspace = true }
doc-comment = { workspace = true }
flate2 = { workspace = true }
parking_lot = { workspace = true }
pretty_assertions = "1.4"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread"] }
