[package]
name = "datafusion-common"
description = "Common functionality for DataFusion query engine"
keywords = ["arrow", "query", "sql"]
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_common"

[features]
backtrace = []
parquet_encryption = [
    "parquet",
    "parquet/encryption",
    "dep:hex",
]
force_hash_collisions = []
recursive_protection = ["dep:recursive"]
parquet = ["dep:parquet"]
sql = ["sqlparser"]

[[bench]]
harness = false
name = "with_hashes"

[[bench]]
harness = false
name = "scalar_to_array"

[[bench]]
harness = false
name = "stats_merge"

[[bench]]
harness = false
name = "record_batch_memory"

[dependencies]
arrow = { workspace = true }
arrow-ipc = { workspace = true }
arrow-schema = { workspace = true, features = ["canonical_extension_types"] }
arrow-select = { workspace = true }
chrono = { workspace = true }
foldhash = "0.2"
half = { workspace = true }
hashbrown = { workspace = true }
hex = { workspace = true, optional = true }
indexmap = { workspace = true }
itertools = { workspace = true }
libc = "0.2.185"
log = { workspace = true }
num-traits = { workspace = true }
object_store = { workspace = true, optional = true }
parquet = { workspace = true, optional = true, default-features = true }
parquet-variant-compute = { workspace = true }
recursive = { workspace = true, optional = true }
sqlparser = { workspace = true, optional = true }
tokio = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(target_family = "wasm")'.dependencies]
web-time = "1.1.0"

[dev-dependencies]
chrono = { workspace = true }
criterion = { workspace = true }
insta = { workspace = true }
rand = { workspace = true }
sqlparser = { workspace = true }
