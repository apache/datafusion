[package]
name = "datafusion-expr"
description = "Logical plan and expression representation for DataFusion query engine"
keywords = ["datafusion", "logical", "plan", "expressions"]
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[lib]
name = "datafusion_expr"

[features]
default = ["sql"]
# Enables protobuf conversions for the expression types owned by this crate.
# Off by default so consumers that never serialize plans pay nothing. Mirrors
# the `proto` feature on `datafusion-datasource` and friends.
proto = ["dep:datafusion-proto-common", "dep:datafusion-proto-models"]
recursive_protection = ["dep:recursive"]
sql = ["sqlparser"]

[dependencies]
arrow = { workspace = true, features = ["canonical_extension_types"] }
arrow-schema = { workspace = true, features = ["canonical_extension_types"] }
async-trait = { workspace = true }
chrono = { workspace = true }
datafusion-common = { workspace = true, default-features = false }
datafusion-doc = { workspace = true }
datafusion-expr-common = { workspace = true }
datafusion-functions-aggregate-common = { workspace = true }
datafusion-functions-window-common = { workspace = true }
datafusion-physical-expr-common = { workspace = true }
datafusion-proto-common = { workspace = true, optional = true }
datafusion-proto-models = { workspace = true, optional = true }
indexmap = { workspace = true }
itertools = { workspace = true }
recursive = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlparser = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
ctor = { workspace = true }
env_logger = { workspace = true }
insta = { workspace = true }

[[bench]]
name = "find_valid_equijoin_key_pair"
harness = false

[[bench]]
name = "normalize_columns"
harness = false

[[bench]]
name = "case_field_metadata"
harness = false
