# Temporary migration config, matching the approach in PR #26761:
# hawkeye remove --config licenserc-legacy.toml
# hawkeye format --config licenserc.toml
# hawkeye check --config licenserc.toml

[header]
builtin = "Apache-2.0-ASF"

[files]
includes = [
    "datafusion/proto-common/src/generated/mod.rs",
    "datafusion/proto-models/src/generated/mod.rs",
    "*.slt.part",
    "*.md",
    "*.rst",
    "*.sh",
    "*.bat",
    "*.toml",
    "*.yaml",
    "*.yml",
    "*.js",
    "*.cjs",
    "*.css",
    "*.proto",
    "*.rdf",
    ".gitignore",
    ".dockerignore",
    ".editorconfig",
    "Dockerfile",
    "Makefile",
]

excludes = [
    # Generated code; the hand-written generated/mod.rs wrappers are checked.
    "datafusion/proto/src/generated/**",
    "datafusion/proto-common/src/generated/pbjson.rs",
    "datafusion/proto-common/src/generated/prost.rs",
    "datafusion/proto-models/src/generated/datafusion_proto_common.rs",
    "datafusion/proto-models/src/generated/pbjson.rs",
    "datafusion/proto-models/src/generated/prost.rs",
    # HawkEye inserts headers before the YAML front matter required by skills.
    ".ai/skills/**",
    # GitHub contribution templates and temporary generated documentation.
    ".github/ISSUE_TEMPLATE/**",
    ".github/pull_request_template.md",
    "**/.examples-docs-check.*/**",
]

[styles.markdown_legacy]
kind = "block"
start = "<!---"
prefix = "  "
end = "-->"

[styles.batch_legacy]
kind = "line"
prefix = "@rem "

[styles.rst]
kind = "line"
prefix = ".. "

[[rules]]
extensions = ["slt", "slt.part"]
filenames = [".gitignore", ".dockerignore"]
style_out = "script"

[[rules]]
extensions = ["md", "rdf"]
style_out = "xml"
styles_in = ["xml", "markdown_legacy"]

[[rules]]
extensions = ["rst"]
style_out = "rst"

[[rules]]
extensions = ["js", "cjs", "proto"]
style_out = "doubleslash"
styles_in = ["doubleslash", "slashstar", "javadoc"]

[[rules]]
extensions = ["css"]
style_out = "slashstar"
styles_in = ["slashstar", "javadoc"]

[[rules]]
extensions = ["bat"]
style_out = "batch"
styles_in = ["batch", "batch_legacy"]
