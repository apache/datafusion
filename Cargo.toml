[workspace]
members = [
    "datafusion/common",
    "datafusion/common-runtime",
    "datafusion/catalog",
    "datafusion/catalog-listing",
    "datafusion/datasource",
    "datafusion/datasource-arrow",
    "datafusion/datasource-avro",
    "datafusion/datasource-csv",
    "datafusion/datasource-json",
    "datafusion/datasource-parquet",
    "datafusion/core",
    "datafusion/expr",
    "datafusion/expr-common",
    "datafusion/execution",
    "datafusion/ffi",
    "datafusion/functions",
    "datafusion/functions-aggregate",
    "datafusion/functions-aggregate-common",
    "datafusion/functions-table",
    "datafusion/functions-nested",
    "datafusion/functions-window",
    "datafusion/functions-window-common",
    "datafusion/optimizer",
    "datafusion/physical-expr",
    "datafusion/physical-expr-adapter",
    "datafusion/physical-expr-common",
    "datafusion/physical-optimizer",
    "datafusion/pruning",
    "datafusion/physical-plan",
    "datafusion/proto",
    "datafusion/proto-common",
    "datafusion/proto-common/gen",
    "datafusion/proto-models",
    "datafusion/proto-models/gen",
    "datafusion/session",
    "datafusion/spark",
    "datafusion/sql",
    "datafusion/sqllogictest",
    "datafusion/substrait",
    "datafusion/wasmtest",
    "datafusion-cli",
    "datafusion-examples",
    "datafusion-examples/examples/ffi/ffi_example_table_provider",
    "datafusion-examples/examples/ffi/ffi_module_interface",
    "datafusion-examples/examples/ffi/ffi_module_loader",
    "test-utils",
    "benchmarks",
    "datafusion/macros",
    "datafusion/doc",
]
exclude = ["dev/depcheck"]
resolver = "2"

[workspace.package]
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
edition = "2024"
homepage = "https://datafusion.apache.org"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/apache/datafusion"
# Define Minimum Supported Rust Version (MSRV)
rust-version = "1.94.0"
# Define DataFusion version
version = "54.1.0"

[workspace.dependencies]
# We turn off default-features for some dependencies here so the workspaces which inherit them can
# selectively turn them on if needed, since we can override default-features = true (from false)
# for the inherited dependency but cannot do the reverse (override from true to false).
#
# See for more details: https://github.com/rust-lang/cargo/issues/11329
apache-avro = { version = "0.21", default-features = false }
arrow = { version = "59.2.0", features = [
    "prettyprint",
    "chrono-tz",
] }
arrow-avro = { version = "59.2.0", default-features = false, features = [
    "deflate",
    "snappy",
    "zstd",
    "bzip2",
    "xz",
] }
arrow-buffer = { version = "59.2.0", default-features = false }
arrow-data = { version = "59.2.0", default-features = false }
arrow-flight = { version = "59.2.0", features = [
    "flight-sql-experimental",
] }
# Both codecs are required here to make sure that code paths like
# file-spilling have access to all compression codecs.
arrow-ipc = { version = "59.2.0", default-features = false, features = [
    "lz4",
    "zstd",
] }
arrow-ord = { version = "59.2.0", default-features = false }
arrow-schema = { version = "59.2.0", default-features = false }
async-trait = "0.1.89"
bigdecimal = "0.4.8"
bytes = "1.11"
bzip2 = "0.6.1"
chrono = { version = "0.4.45", default-features = false }
criterion = "0.8"
ctor = "1.0.7"
dashmap = "6.2.1"
datafusion = { path = "datafusion/core", version = "54.1.0", default-features = false }
datafusion-catalog = { path = "datafusion/catalog", version = "54.1.0" }
datafusion-catalog-listing = { path = "datafusion/catalog-listing", version = "54.1.0" }
datafusion-common = { path = "datafusion/common", version = "54.1.0", default-features = false }
datafusion-common-runtime = { path = "datafusion/common-runtime", version = "54.1.0" }
datafusion-datasource = { path = "datafusion/datasource", version = "54.1.0", default-features = false }
datafusion-datasource-arrow = { path = "datafusion/datasource-arrow", version = "54.1.0", default-features = false }
datafusion-datasource-avro = { path = "datafusion/datasource-avro", version = "54.1.0", default-features = false }
datafusion-datasource-csv = { path = "datafusion/datasource-csv", version = "54.1.0", default-features = false }
datafusion-datasource-json = { path = "datafusion/datasource-json", version = "54.1.0", default-features = false }
datafusion-datasource-parquet = { path = "datafusion/datasource-parquet", version = "54.1.0", default-features = false }
datafusion-doc = { path = "datafusion/doc", version = "54.1.0" }
datafusion-execution = { path = "datafusion/execution", version = "54.1.0", default-features = false }
datafusion-expr = { path = "datafusion/expr", version = "54.1.0", default-features = false }
datafusion-expr-common = { path = "datafusion/expr-common", version = "54.1.0" }
datafusion-ffi = { path = "datafusion/ffi", version = "54.1.0" }
datafusion-functions = { path = "datafusion/functions", version = "54.1.0" }
datafusion-functions-aggregate = { path = "datafusion/functions-aggregate", version = "54.1.0" }
datafusion-functions-aggregate-common = { path = "datafusion/functions-aggregate-common", version = "54.1.0" }
datafusion-functions-nested = { path = "datafusion/functions-nested", version = "54.1.0", default-features = false }
datafusion-functions-table = { path = "datafusion/functions-table", version = "54.1.0" }
datafusion-functions-window = { path = "datafusion/functions-window", version = "54.1.0" }
datafusion-functions-window-common = { path = "datafusion/functions-window-common", version = "54.1.0" }
datafusion-macros = { path = "datafusion/macros", version = "54.1.0" }
datafusion-optimizer = { path = "datafusion/optimizer", version = "54.1.0", default-features = false }
datafusion-physical-expr = { path = "datafusion/physical-expr", version = "54.1.0", default-features = false }
datafusion-physical-expr-adapter = { path = "datafusion/physical-expr-adapter", version = "54.1.0", default-features = false }
datafusion-physical-expr-common = { path = "datafusion/physical-expr-common", version = "54.1.0", default-features = false }
datafusion-physical-optimizer = { path = "datafusion/physical-optimizer", version = "54.1.0" }
datafusion-physical-plan = { path = "datafusion/physical-plan", version = "54.1.0" }
datafusion-proto = { path = "datafusion/proto", version = "54.1.0", default-features = false }
datafusion-proto-common = { path = "datafusion/proto-common", version = "54.1.0" }
datafusion-proto-models = { path = "datafusion/proto-models", version = "54.1.0" }
datafusion-pruning = { path = "datafusion/pruning", version = "54.1.0" }
datafusion-session = { path = "datafusion/session", version = "54.1.0" }
datafusion-spark = { path = "datafusion/spark", version = "54.1.0" }
datafusion-sql = { path = "datafusion/sql", version = "54.1.0" }
datafusion-substrait = { path = "datafusion/substrait", version = "54.1.0" }

doc-comment = "0.3"
env_logger = "0.11"
flate2 = "1.1.9"
futures = "0.3"
glob = "0.3.0"
half = { version = "2.7.0", default-features = false }
hashbrown = { version = "0.17.1" }
hex = { version = "0.4.3" }
indexmap = "2.14.0"
insta = { version = "1.47.2", features = ["glob", "filters"] }
itertools = "0.15"
itoa = "1.0"
liblzma = { version = "0.4.6", features = ["static"] }
log = "^0.4"
memchr = "2.8.1"
num-traits = { version = "0.2" }
object_store = { version = "0.13.2", default-features = false }
parking_lot = "0.12"
parquet = { version = "59.2.0", default-features = false, features = [
    "arrow",
    "async",
    "object_store",
] }
pbjson = { version = "0.9.0" }
pbjson-types = "0.9"
percent-encoding = "2.3"
pin-project = "1"
pin-project-lite = "^0.2.7"
# Should match arrow-flight's version of prost.
prost = "0.14.1"
rand = "0.9"
recursive = "0.1.1"
regex = "1.12"
rstest = "0.26.1"
serde_json = "1"
sha2 = "^0.11.0"
sqlparser = { version = "0.62.0", default-features = false, features = ["std", "visitor"] }
stacker = "0.1.24"
strum = "0.28.0"
strum_macros = "0.28.0"
tempfile = "3"
testcontainers-modules = { version = "0.15" }
tokio = { version = "1.52", features = ["macros", "rt", "sync"] }
tokio-stream = "0.1"
tokio-util = "0.7"
url = "2.5.7"
uuid = "1.23"
zstd = { version = "0.13", default-features = false }

# Keep this list sorted alphabetically.
# See https://github.com/apache/datafusion/issues/18467 for the ongoing effort of
# picking useful non-default lints.
[workspace.lints.clippy]
# https://github.com/apache/datafusion/issues/18881
allow_attributes = "warn"
as_ptr_cast_mut = "warn"
assigning_clones = "warn"
clear_with_drain = "warn"
coerce_container_to_any = "warn"
debug_assert_with_mut_call = "warn"
decimal_bitwise_operands = "warn"
default_union_representation = "warn"
doc_include_without_cfg = "warn"
empty_enum_variants_with_brackets = "warn"
empty_enums = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
# Catches `From` impls that can panic
fallible_impl_from = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
fn_to_numeric_cast_any = "warn"
imprecise_flops = "warn"
index_refutable_slice = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
into_iter_without_iter = "warn"
invalid_upcast_comparisons = "warn"
ip_constant = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
iter_not_returning_iterator = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_without_into_iter = "warn"
# Detects large stack-allocated futures that may cause stack overflow crashes (see threshold in clippy.toml)
large_futures = "warn"
large_include_file = "warn"
# Like `large_futures`, these guard against stack overflows
large_stack_arrays = "warn"
large_stack_frames = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
# Catches `"{foo}"` where the string is never actually formatted
literal_string_with_formatting_args = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_ilog2 = "warn"
manual_instant_elapsed = "warn"
manual_is_power_of_two = "warn"
# `(a + b) / 2` can overflow; `a.midpoint(b)` cannot
manual_midpoint = "warn"
match_wild_err_arm = "warn"
mem_forget = "warn"
mismatching_type_param_order = "warn"
mut_mut = "warn"
# https://github.com/apache/datafusion/issues/18503
needless_pass_by_value = "warn"
negative_feature_names = "warn"
# Prefer `std::sync::LazyLock` over the `lazy_static`/`once_cell` crates
non_std_lazy_statics = "warn"
non_zero_suggestions = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
or_fun_call = "warn"
path_buf_push_overwrite = "warn"
pathbuf_init_then_push = "warn"
precedence_bits = "warn"
ptr_cast_constness = "warn"
pub_underscore_fields = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
ref_as_ptr = "warn"
ref_option_ref = "warn"
# Catches copy-paste bugs in `if`/`else if` chains
same_functions_in_if_condition = "warn"
same_length_and_capacity = "warn"
# Catches a `&self` argument that is only threaded through recursive calls
self_only_used_in_recursion = "warn"
# Avoids hashing the key twice
set_contains_or_insert = "warn"
str_split_at_newline = "warn"
string_add_assign = "warn"
string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_xor_used_as_pow = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
transmute_ptr_to_ptr = "warn"
# Subtracting `Instant`s panics on overflow; use `saturating_duration_since`
unchecked_time_subtraction = "warn"
uninhabited_references = "warn"
uninlined_format_args = "warn"
unnecessary_box_returns = "warn"
# `{:?}` on a `Path` quotes and escapes it; `{}` on `.display()` does not
unnecessary_debug_formatting = "warn"
unnecessary_lazy_evaluations = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unnecessary_self_imports = "warn"
unused_async = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
used_underscore_binding = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"
zero_sized_map_values = "warn"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(datafusion_coop, values("tokio", "tokio_fallback", "per_stream"))',
    "cfg(coverage)",
    "cfg(coverage_nightly)",
] }
unused_qualifications = "deny"

# --------------------
# Compilation Profiles
# --------------------
# A Cargo profile is a preset for the compiler/linker knobs that trades off:
# - Build time: how quickly code compiles and links
# - Runtime performance: how fast the resulting binaries execute
# - Binary size: how large the executables end up
# - Debuggability: how much debug information is preserved for debugging and profiling
#
# To use a profile: `cargo [ build | run | ... ] --profile <profile-name>`
#
# Profiles available:
# - dev: default debug build; fastest to compile, slowest to run, full debug info.
#     For everyday development; default for "cargo [ build | test | run ]".
# - release: fully optimized build; slowest to compile, fastest to run, smallest
#     binaries. For public releases; default for "cargo [ bench | install ]".
# - release-nonlto: skips LTO, so it builds much faster while staying close to
#     release performance. Useful when developing performance optimizations.
# - profiling: inherits release optimizations but retains debug info to support
#     profiling tools and flamegraphs.
# - ci: derived from `dev` but disables debug info and incremental builds to keep
#     CI artifacts small and reproducible.
# - ci-optimized: derived from `release` but enables debug assertions and uses
#     less aggressive optimizations for faster builds.  Used for long-running CI
#     tasks.
#
# If you want to optimize compilation, the `compile_profile` benchmark can be useful.
# See `benchmarks/README.md` for more details.
[profile.release]
codegen-units = 1
lto = true
strip = true      # Eliminate debug info to minimize binary size

[profile.release-nonlto]
inherits = "release"
codegen-units = 16
lto = false
strip = false        # Retain debug info for flamegraphs

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.ci-optimized]
inherits = "release"
debug-assertions = true
codegen-units = 16
lto = "thin"

[profile.ci]
inherits = "dev"
debug = false
incremental = false

# This rule applies to every package except workspace members (dependencies
# such as `arrow` and `tokio`). It disables debug info and related features on
# dependencies so their binaries stay smaller, improving cache reuse.
[profile.ci.package."*"]
debug = false
debug-assertions = false
strip = "debuginfo"
incremental = false
