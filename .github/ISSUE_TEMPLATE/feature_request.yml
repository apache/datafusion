name: Feature request
description: Suggest an idea for this project
type: Feature
labels: enhancement
body:
  - type: textarea
    attributes:
      label: Is your feature request related to a problem or challenge?
      description: Please describe what you are trying to do.
      placeholder: >
        A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]
        (This section helps DataFusion developers understand the context and *why* for this feature, in addition to the *what*)
  - type: textarea
    attributes:
      label: Describe the solution you'd like
      placeholder: >
        A clear and concise description of what you want to happen.
  - type: textarea
    attributes:
      label: Describe alternatives you've considered
      placeholder: >
        A clear and concise description of any alternative solutions or features you've considered.
  - type: textarea
    attributes:
      label: Additional context
      placeholder: >
        Add any other context or screenshots about the feature request here.
  - type: dropdown
    attributes:
      label: Willingness to contribute
      description: >
        The Apache DataFusion community encourages feature contributions. Would you or another member of your organization be willing to contribute to this feature for the Apache DataFusion codebase?
      options:
        - I plan to contribute to this feature independently
        - I would like to contribute to this feature, but request guidance from the DataFusion community
        - I cannot contribute to this feature at this time
