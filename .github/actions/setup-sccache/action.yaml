name: Configure RunsOn compiler cache
description: Configure sccache on RunsOn after restoring the Rust dependency cache.
runs:
  using: composite
  steps:
    - name: Install sccache
      uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2.90.2
      with:
        tool: sccache@0.19.0
    - name: Configure S3 compiler cache
      uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc  # v2.7.0
      with:
        sccache: s3
