name: Prepare Docs Builder
description: 'Install the tools needed to build the documentation in docs'
runs:
  using: "composite"
  steps:
    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-rustup
    - name: Setup uv
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
    - name: Install Python dependencies
      shell: bash
      run: uv sync --package datafusion-docs
    - name: Install Graphviz
      shell: bash
      run: |
        set -x
        sudo apt-get update
        sudo apt-get install -y graphviz
    - name: Install cargo-depgraph
      uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
      with:
        tool: cargo-depgraph@1.6
