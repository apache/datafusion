name: Prepare Docs Builder
description: 'Install the tools needed to build the documentation in docs'
runs:
  using: "composite"
  steps:
    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-rustup
    - name: Setup uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
    - name: Install Python dependencies
      shell: bash
      run: uv sync --package datafusion-docs
    - name: Install Graphviz
      shell: bash
      run: |
        set -x
        sudo apt-get update
        sudo apt-get install -y graphviz
    - name: Install cargo-depgraph
      uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68  # v2.88.1
      with:
        tool: cargo-depgraph@1.6
