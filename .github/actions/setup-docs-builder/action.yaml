name: Prepare Docs Builder
description: 'Install the tools needed to build the documentation in docs'
runs:
  using: "composite"
  steps:
    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-rustup
    - name: Setup uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
    - name: Install Python dependencies
      shell: bash
      run: uv sync --package datafusion-docs
    - name: Install Graphviz
      shell: bash
      run: |
        set -x
        sudo apt-get update
        sudo apt-get install -y graphviz
    - name: Install cargo-depgraph
      uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21  # v2.90.4
      with:
        tool: cargo-depgraph@1.6
