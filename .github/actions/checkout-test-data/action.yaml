name: Checkout Arrow and Parquet test data
description: Check out Arrow and Parquet fixtures without the separate SQLite suite.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git submodule sync -- testing parquet-testing
        git submodule update --init --depth=1 testing parquet-testing
