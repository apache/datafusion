name: Prepare Rust Builder
description: 'Prepare Rust Build Environment'
inputs:
  disk-cleanup-threshold-gb:
    description: 'Skip disk cleanup when at least this many GiB are free; 0 always cleans'
    default: '0'
runs:
  using: "composite"
  steps:
    - name: Install Build Dependencies
      shell: bash
      run: |
        RETRY=("ci/scripts/retry" timeout 120)
        "${RETRY[@]}" apt-get update
        "${RETRY[@]}" apt-get install -y protobuf-compiler
    - name: Setup Rust toolchain
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        RETRY=("ci/scripts/retry" timeout 120)
        "${RETRY[@]}" rustup toolchain install
    - name: Configure rust runtime env
      uses: ./.github/actions/setup-rust-runtime
    - name: Fixup git permissions
      # https://github.com/actions/checkout/issues/766
      shell: bash
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Remove unnecessary preinstalled software
      shell: bash
      env:
        DISK_CLEANUP_THRESHOLD_GB: ${{ inputs.disk-cleanup-threshold-gb }}
      run: |
        echo "Disk space before cleanup:"
        df -h
        if (( DISK_CLEANUP_THRESHOLD_GB > 0 )); then
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')"
          if (( available_kib >= DISK_CLEANUP_THRESHOLD_GB * 1024 * 1024 )); then
            echo "Skipping disk cleanup: at least ${DISK_CLEANUP_THRESHOLD_GB} GiB are free."
            exit 0
          fi
        fi
        apt-get clean
        # remove tool cache: about 8.5GB (github has host /opt/hostedtoolcache mounted as /__t)
        rm -rf /__t/* || true
        # remove Haskell runtime: about 6.3GB (host /usr/local/.ghcup)
        rm -rf /host/usr/local/.ghcup || true
        # remove Android library: about 7.8GB (host /usr/local/lib/android)
        rm -rf /host/usr/local/lib/android || true
        echo "Disk space after cleanup:"
        df -h
