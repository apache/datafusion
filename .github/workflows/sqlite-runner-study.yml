name: SQLite same runner study
'on':
  push:
    paths:
    - .github/workflows/sqlite-runner-study.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sqlite:
    name: SQLite (${{ matrix.first }} first)
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a,cpu=32,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id)
      || 'ubuntu-latest' }}
    container:
      image: amd64/rust
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        first:
        - base
        - head
    steps:
    - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 1
        submodules: true
    - name: Install build tools
      run: apt-get update && apt-get install -y protobuf-compiler time
    - name: Allow checkout changes
      run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Show runner details
      run: |
        lscpu
        cat /proc/meminfo
        rustc -vV
        df -h
        printf "RUSTFLAGS=%s\nCARGO_INCREMENTAL=%s\n" "${RUSTFLAGS-<unset>}" "${CARGO_INCREMENTAL-<unset>}"
    - name: first checkout
      env:
        REVISION: ${{ matrix.first == 'base' && '06fde08f7bf1a13a15e17bff5075a600a0be3cdb' || 'b7885867a0b9a90f71f15c4ffeda53a4ef5a20a0' }}
      shell: bash
      run: |
        git fetch --no-tags --depth=1 origin "$REVISION"
        git checkout --detach "$REVISION"
        git submodule update --init --depth=1
        git clean -fdx
        rm -rf "$CARGO_HOME/registry"
        git rev-parse HEAD
    - name: first SQLite suite
      env:
        SLT_TIMING_SUMMARY: 'true'
      shell: bash
      run: |
        /usr/bin/time -v cargo xtask ci step test sqlite 2>&1 | tee "$RUNNER_TEMP/sqlite-first.log"
    - name: second checkout
      env:
        REVISION: ${{ matrix.first != 'base' && '06fde08f7bf1a13a15e17bff5075a600a0be3cdb' || 'b7885867a0b9a90f71f15c4ffeda53a4ef5a20a0' }}
      shell: bash
      run: |
        git fetch --no-tags --depth=1 origin "$REVISION"
        git checkout --detach "$REVISION"
        git submodule update --init --depth=1
        git clean -fdx
        rm -rf "$CARGO_HOME/registry"
        git rev-parse HEAD
    - name: second SQLite suite
      env:
        SLT_TIMING_SUMMARY: 'true'
      shell: bash
      run: |
        /usr/bin/time -v cargo xtask ci step test sqlite 2>&1 | tee "$RUNNER_TEMP/sqlite-second.log"
    - name: Upload SQLite timing logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: sqlite-${{ matrix.first }}-first
        path: ${{ runner.temp }}/sqlite-*.log
        retention-days: 3
