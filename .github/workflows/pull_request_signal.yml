# Signal for the workflows that need a write token on a pull request.
#
# ASF infra policy disables `pull_request_target`
# (https://infra.apache.org/github-actions-policy.html), and GitHub is adding a
# default policy that blocks it. The `workflow_run` workflows below run from the
# default branch with a write token and never check out or run pull request
# code:
#   - labeler.yml
#   - fork_ci_status.yml
#
# They trigger on the `requested` event of this workflow. GitHub sends it at
# once for every run, even one that waits for the approval of a first-time
# contributor. This is not documented, but it is seen in
# apache/spark-kubernetes-operator, which uses the same pattern. GitHub does not
# send `requested` when this workflow is re-run, so push to the pull request, or
# close and reopen it, to run them again.
#
# A pull request runs its own copy of this file, so it can change or delete it.
# That only skips the labels and the immediate `Rust (fork)` check for that pull
# request. GitHub also skips `pull_request` workflows while a pull request has
# merge conflicts, or when its head commit message has `[skip ci]` or another
# skip marker, so such a pull request gets its labels with a later push. The
# scheduled update in `fork_ci_status.yml` creates the check in all of these
# cases, and the merge queue stays the gate.
name: Pull request signal

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  signal:
    name: Signal pull request update
    runs-on: ubuntu-slim
    steps:
      - run: echo "This run triggers the workflow_run workflows that handle the pull request."
