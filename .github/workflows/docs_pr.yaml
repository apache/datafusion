# Tests for Docs that runs on PRs
name: Docs

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "docs/**"
      - "ci/scripts/check_docs_html.sh"
    branches:
      - main
      - branch-*
  pull_request:
    paths:
      - "docs/**"
      - "ci/scripts/check_docs_html.sh"
  # manual trigger
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Test doc build
  linux-test-doc-build:
    name: Test doc build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: true
          fetch-depth: 1
      - name: Setup uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0
      - name: Install doc dependencies
        run: uv sync --package datafusion-docs
      - name: Install Graphviz
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y graphviz
      - name: Install cargo-depgraph
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3  # v2.87.16
        with:
          tool: cargo-depgraph@1.6
      - name: Build docs html and check for warnings
        run: ./ci/scripts/check_docs_html.sh # fails on errors
