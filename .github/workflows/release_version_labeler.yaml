# Add the expected target version as a label to a merged PR.
# The "target_version" is automatically updated by the dev/update_datafusion_versions.py script.

name: Release Version Labeler

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

jobs:
  label:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Add the target release version
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const labeler = require('./ci/scripts/release_version_labeler.js');
            await labeler({ github, context });
