# Add the expected target version as a label to a merged PR.
# The "target_version" is automatically updated by the dev/update_datafusion_versions.py script.

name: Release Version Labeler

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

jobs:
  label:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
    steps:
      - name: Add the target release version 
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const target_version = 'v56.0.0';

            // create label first if not exists
            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: target_version
              });
            } catch (error) {
              if (error.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: target_version,
                  color: '222222'
                });
              } else {
                throw error;
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [target_version]
            });
