# Add the expected target version as a label to a merged PR.
# The "target_version" is automatically updated by the dev/update_datafusion_versions.py script.

name: Release Version Labeler

# `pull_request_target` is disabled by ASF infra policy, so label on the push of
# the merge commit to `main` and look up the merged pull request from it.
on:
  push:
    branches:
      - main

jobs:
  label:
    # A fork that syncs its main branch also gets this push, and has nothing to label.
    if: github.repository == 'apache/datafusion'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Add the target release version
        uses: actions/github-script@v9.0.0
        with:
          script: |
            const labeler = require('./ci/scripts/release_version_labeler.js');
            await labeler({ github, context });
