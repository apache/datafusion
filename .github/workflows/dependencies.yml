name: Dependencies

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  push:
    branches-ignore:
      # Commits reach main through the merge queue, which runs this workflow at
      # the same SHA, so do not repeat the jobs after the merge. Release
      # branches and every other branch keep their post-push runs.
      - 'main'
      - 'gh-readonly-queue/**'
      - 'dependabot/**'
  pull_request:
  merge_group:
  # manual trigger
  # https://docs.github.com/en/actions/managing-workflow-runs/manually-running-a-workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-unused-dependencies:
    name: Detect Unused Dependencies
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rustup
      - name: Load tool versions
        run: |
          . ci/scripts/utils/tool_versions.sh
          echo "CARGO_MACHETE_VERSION=${CARGO_MACHETE_VERSION}" >> "$GITHUB_ENV"
      - name: Install cargo-machete
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91  # v2.87.31
        with:
          tool: cargo-machete@${{ env.CARGO_MACHETE_VERSION }}
      - name: Detect unused dependencies
        run: bash ci/scripts/check_unused_dependencies.sh
