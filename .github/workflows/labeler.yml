name: Labeler

# `pull_request_target` is disabled by ASF infra policy. This workflow runs from
# the default branch when `pull_request_signal.yml` starts, so it never runs the
# code of a pull request. See that file for details.
concurrency:
  group: ${{ github.repository }}-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}-${{ github.workflow }}
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["Pull request signal"]
    types: [requested]

permissions: {}

jobs:
  process:
    name: Process
    runs-on: ubuntu-slim
    if: github.event.workflow_run.event == 'pull_request'
    # The token of a `workflow_run` workflow can update PRs from forks.
    # Previously `pull_request_target` was used for the same reason, see
    # https://github.com/apache/datafusion/issues/3743
    permissions:
      contents: read
      pull-requests: write
    steps:
      # `workflow_run.pull_requests` is empty for pull requests from forks, so
      # find the pull request by its head branch and commit. An outdated commit
      # matches nothing, since a newer run labels the new head.
      - name: Find the pull request
        id: pr
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const { data } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            const pr = data.find((pr) => pr.head.sha === run.head_sha);
            if (pr) core.setOutput('number', String(pr.number));
            else core.info(`No open pull request for ${run.head_sha}`);

      - name: Assign GitHub labels
        if: steps.pr.outputs.number != ''
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ steps.pr.outputs.number }}
          configuration-path: .github/workflows/labeler/labeler-config.yml
          sync-labels: true

      # TODO: Enable this when eps1lon/actions-label-merge-conflict is available.
      # - name: Checks if PR needs rebase
      #   if: |
      #     github.event_name == 'push' ||
      #     (github.event_name == 'pull_request_target' &&
      #        (github.event.action == 'opened' ||
      #         github.event.action == 'synchronize'))
      #   uses: eps1lon/actions-label-merge-conflict@releases/2.x
      #   with:
      #     dirtyLabel: "needs-rebase"
      #     repoToken: "${{ secrets.GITHUB_TOKEN }}"
