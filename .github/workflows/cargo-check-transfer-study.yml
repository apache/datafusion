name: Cargo check transfer study
'on':
  push:
    paths:
    - .github/workflows/cargo-check-transfer-study.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  initial-cold:
    name: Initial cargo check (cold)
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a,cpu=8,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id)
      || 'ubuntu-latest' }}
    container:
      image: amd64/rust
    steps:
    - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-builder
      with:
        disk-cleanup-threshold-gb: 20
    - name: Show runner details
      run: |
        lscpu
        cat /proc/meminfo
        rustc -vV
        df -h
        printf "RUSTFLAGS=%s\nCARGO_INCREMENTAL=%s\n" "${RUSTFLAGS-<unset>}" "${CARGO_INCREMENTAL-<unset>}"
    - name: Rust Dependency Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        prefix-key: transfer-study-${{ github.run_id }}
        shared-key: amd-ci-check
        save-if: true
    - name: Prepare cargo build
      run: cargo xtask ci step check workspace
    - name: Archive Cargo check artifacts
      id: archive-check
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/cargo-check"
        # Preserve source timestamps so Cargo can reuse workspace crates.
        git ls-files -z | tar --null -T - -cf "$RUNNER_TEMP/cargo-check/check-workspace.tar" target
        # -C incremental=false creates per-crate caches named "false".
        tar --anchored --no-wildcards-match-slash \
          --exclude='registry/src/*/*/false' \
          -cf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME" registry
    - name: Upload Cargo check artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cargo-check-cold
        path: ${{ runner.temp }}/cargo-check/
        compression-level: 1
        retention-days: 1
        if-no-files-found: error
        overwrite: true
  initial-warm:
    name: Initial cargo check (warm)
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a,cpu=8,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id)
      || 'ubuntu-latest' }}
    container:
      image: amd64/rust
    steps:
    - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-builder
      with:
        disk-cleanup-threshold-gb: 20
    - name: Show runner details
      run: |
        lscpu
        cat /proc/meminfo
        rustc -vV
        df -h
        printf "RUSTFLAGS=%s\nCARGO_INCREMENTAL=%s\n" "${RUSTFLAGS-<unset>}" "${CARGO_INCREMENTAL-<unset>}"
    - name: Rust Dependency Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        prefix-key: transfer-study-${{ github.run_id }}
        shared-key: amd-ci-check
        save-if: false
    - name: Prepare cargo build
      run: cargo xtask ci step check workspace
    - name: Archive Cargo check artifacts
      id: archive-check
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/cargo-check"
        # Preserve source timestamps so Cargo can reuse workspace crates.
        git ls-files -z | tar --null -T - -cf "$RUNNER_TEMP/cargo-check/check-workspace.tar" target
        # -C incremental=false creates per-crate caches named "false".
        tar --anchored --no-wildcards-match-slash \
          --exclude='registry/src/*/*/false' \
          -cf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME" registry
    - name: Upload Cargo check artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cargo-check-warm
        path: ${{ runner.temp }}/cargo-check/
        compression-level: 1
        retention-days: 1
        if-no-files-found: error
        overwrite: true
    needs: initial-cold
  datafusion:
    name: datafusion (${{ matrix.temperature }}, ${{ matrix.first }} first)
    needs:
    - initial-cold
    - initial-warm
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a,cpu=16,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id)
      || 'ubuntu-latest' }}
    container:
      image: amd64/rust
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        temperature:
        - cold
        - warm
        first:
        - artifact
        - cache
    steps:
    - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-builder
    - name: Show runner details
      run: |
        lscpu
        cat /proc/meminfo
        rustc -vV
        df -h
        printf "RUSTFLAGS=%s\nCARGO_INCREMENTAL=%s\n" "${RUSTFLAGS-<unset>}" "${CARGO_INCREMENTAL-<unset>}"
    - name: Reset inputs for first mode
      shell: bash
      run: |
        rm -rf target "$CARGO_HOME/registry" "$RUNNER_TEMP/cargo-check"
        git ls-files -z | xargs -0 touch
    - name: first cache restore
      if: matrix.first == 'cache'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        prefix-key: ${{ matrix.temperature == 'cold' && format('transfer-study-{0}-missing', github.run_id) || format('transfer-study-{0}', github.run_id) }}
        shared-key: amd-ci-check
        save-if: false
    - name: first artifact download
      if: matrix.first == 'artifact'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: cargo-check-${{ matrix.temperature }}
        path: ${{ runner.temp }}/cargo-check
    - name: first artifact extract
      if: matrix.first == 'artifact'
      run: |
        tar -xf "$RUNNER_TEMP/cargo-check/check-workspace.tar"
        tar -xf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME"
    - name: 'first: Check datafusion (default features)'
      run: cargo xtask ci step check datafusion default
    - name: 'first: Check datafusion (no-default-features)'
      run: cargo xtask ci step check datafusion no-default
    - name: 'first: Check datafusion (nested_expressions)'
      run: cargo xtask ci step check datafusion nested_expressions
    - name: 'first: Check datafusion (array_expressions)'
      run: cargo xtask ci step check datafusion array_expressions
    - name: 'first: Check datafusion (avro)'
      run: cargo xtask ci step check datafusion avro
    - name: 'first: Check datafusion (backtrace)'
      run: cargo xtask ci step check datafusion backtrace
    - name: 'first: Check datafusion (compression)'
      run: cargo xtask ci step check datafusion compression
    - name: 'first: Check datafusion (crypto_expressions)'
      run: cargo xtask ci step check datafusion crypto_expressions
    - name: 'first: Check datafusion (datetime_expressions)'
      run: cargo xtask ci step check datafusion datetime_expressions
    - name: 'first: Check datafusion (encoding_expressions)'
      run: cargo xtask ci step check datafusion encoding_expressions
    - name: 'first: Check datafusion (force_hash_collisions)'
      run: cargo xtask ci step check datafusion force_hash_collisions
    - name: 'first: Check datafusion (math_expressions)'
      run: cargo xtask ci step check datafusion math_expressions
    - name: 'first: Check datafusion (parquet)'
      run: cargo xtask ci step check datafusion parquet
    - name: 'first: Check datafusion (regex_expressions)'
      run: cargo xtask ci step check datafusion regex_expressions
    - name: 'first: Check datafusion (recursive_protection)'
      run: cargo xtask ci step check datafusion recursive_protection
    - name: 'first: Check datafusion (serde)'
      run: cargo xtask ci step check datafusion serde
    - name: 'first: Check datafusion (sql)'
      run: cargo xtask ci step check datafusion sql
    - name: 'first: Check datafusion (string_expressions)'
      run: cargo xtask ci step check datafusion string_expressions
    - name: 'first: Check datafusion (unicode_expressions)'
      run: cargo xtask ci step check datafusion unicode_expressions
    - name: 'first: Check parquet encryption (parquet_encryption)'
      run: cargo xtask ci step check datafusion parquet_encryption
    - name: Reset inputs for second mode
      shell: bash
      run: |
        rm -rf target "$CARGO_HOME/registry" "$RUNNER_TEMP/cargo-check"
        git ls-files -z | xargs -0 touch
    - name: second cache restore
      if: (matrix.first == 'artifact' && 'cache' || 'artifact') == 'cache'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        prefix-key: ${{ matrix.temperature == 'cold' && format('transfer-study-{0}-missing', github.run_id) || format('transfer-study-{0}', github.run_id) }}
        shared-key: amd-ci-check
        save-if: false
    - name: second artifact download
      if: (matrix.first == 'artifact' && 'cache' || 'artifact') == 'artifact'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: cargo-check-${{ matrix.temperature }}
        path: ${{ runner.temp }}/cargo-check
    - name: second artifact extract
      if: (matrix.first == 'artifact' && 'cache' || 'artifact') == 'artifact'
      run: |
        tar -xf "$RUNNER_TEMP/cargo-check/check-workspace.tar"
        tar -xf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME"
    - name: 'second: Check datafusion (default features)'
      run: cargo xtask ci step check datafusion default
    - name: 'second: Check datafusion (no-default-features)'
      run: cargo xtask ci step check datafusion no-default
    - name: 'second: Check datafusion (nested_expressions)'
      run: cargo xtask ci step check datafusion nested_expressions
    - name: 'second: Check datafusion (array_expressions)'
      run: cargo xtask ci step check datafusion array_expressions
    - name: 'second: Check datafusion (avro)'
      run: cargo xtask ci step check datafusion avro
    - name: 'second: Check datafusion (backtrace)'
      run: cargo xtask ci step check datafusion backtrace
    - name: 'second: Check datafusion (compression)'
      run: cargo xtask ci step check datafusion compression
    - name: 'second: Check datafusion (crypto_expressions)'
      run: cargo xtask ci step check datafusion crypto_expressions
    - name: 'second: Check datafusion (datetime_expressions)'
      run: cargo xtask ci step check datafusion datetime_expressions
    - name: 'second: Check datafusion (encoding_expressions)'
      run: cargo xtask ci step check datafusion encoding_expressions
    - name: 'second: Check datafusion (force_hash_collisions)'
      run: cargo xtask ci step check datafusion force_hash_collisions
    - name: 'second: Check datafusion (math_expressions)'
      run: cargo xtask ci step check datafusion math_expressions
    - name: 'second: Check datafusion (parquet)'
      run: cargo xtask ci step check datafusion parquet
    - name: 'second: Check datafusion (regex_expressions)'
      run: cargo xtask ci step check datafusion regex_expressions
    - name: 'second: Check datafusion (recursive_protection)'
      run: cargo xtask ci step check datafusion recursive_protection
    - name: 'second: Check datafusion (serde)'
      run: cargo xtask ci step check datafusion serde
    - name: 'second: Check datafusion (sql)'
      run: cargo xtask ci step check datafusion sql
    - name: 'second: Check datafusion (string_expressions)'
      run: cargo xtask ci step check datafusion string_expressions
    - name: 'second: Check datafusion (unicode_expressions)'
      run: cargo xtask ci step check datafusion unicode_expressions
    - name: 'second: Check parquet encryption (parquet_encryption)'
      run: cargo xtask ci step check datafusion parquet_encryption
  substrait:
    name: substrait (${{ matrix.temperature }}, ${{ matrix.first }} first)
    needs:
    - initial-cold
    - initial-warm
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a,cpu=16,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id)
      || 'ubuntu-latest' }}
    container:
      image: amd64/rust
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        temperature:
        - cold
        - warm
        first:
        - artifact
        - cache
    steps:
    - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-builder
    - name: Show runner details
      run: |
        lscpu
        cat /proc/meminfo
        rustc -vV
        df -h
        printf "RUSTFLAGS=%s\nCARGO_INCREMENTAL=%s\n" "${RUSTFLAGS-<unset>}" "${CARGO_INCREMENTAL-<unset>}"
    - name: Reset inputs for first mode
      shell: bash
      run: |
        rm -rf target "$CARGO_HOME/registry" "$RUNNER_TEMP/cargo-check"
        git ls-files -z | xargs -0 touch
    - name: first cache restore
      if: matrix.first == 'cache'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        prefix-key: ${{ matrix.temperature == 'cold' && format('transfer-study-{0}-missing', github.run_id) || format('transfer-study-{0}', github.run_id) }}
        shared-key: amd-ci-check
        save-if: false
    - name: first artifact download
      if: matrix.first == 'artifact'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: cargo-check-${{ matrix.temperature }}
        path: ${{ runner.temp }}/cargo-check
    - name: first artifact extract
      if: matrix.first == 'artifact'
      run: |
        tar -xf "$RUNNER_TEMP/cargo-check/check-workspace.tar"
        tar -xf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME"
    - name: 'first: Check datafusion-substrait (default features)'
      run: cargo xtask ci step check datafusion-substrait default
    - name: 'first: Check datafusion-substrait (no-default-features)'
      run: cargo xtask ci step check datafusion-substrait no-default
    - name: 'first: Check datafusion-substrait (physical)'
      run: cargo xtask ci step check datafusion-substrait physical
    - name: 'first: Install cmake'
      run: |
        # note the builder setup runs apt-get update / installs protobuf compiler
        apt-get install -y cmake
    - name: 'first: Check datafusion-substrait (protoc)'
      run: cargo xtask ci step check datafusion-substrait protoc
    - name: Reset inputs for second mode
      shell: bash
      run: |
        rm -rf target "$CARGO_HOME/registry" "$RUNNER_TEMP/cargo-check"
        git ls-files -z | xargs -0 touch
    - name: second cache restore
      if: (matrix.first == 'artifact' && 'cache' || 'artifact') == 'cache'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        prefix-key: ${{ matrix.temperature == 'cold' && format('transfer-study-{0}-missing', github.run_id) || format('transfer-study-{0}', github.run_id) }}
        shared-key: amd-ci-check
        save-if: false
    - name: second artifact download
      if: (matrix.first == 'artifact' && 'cache' || 'artifact') == 'artifact'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: cargo-check-${{ matrix.temperature }}
        path: ${{ runner.temp }}/cargo-check
    - name: second artifact extract
      if: (matrix.first == 'artifact' && 'cache' || 'artifact') == 'artifact'
      run: |
        tar -xf "$RUNNER_TEMP/cargo-check/check-workspace.tar"
        tar -xf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME"
    - name: 'second: Check datafusion-substrait (default features)'
      run: cargo xtask ci step check datafusion-substrait default
    - name: 'second: Check datafusion-substrait (no-default-features)'
      run: cargo xtask ci step check datafusion-substrait no-default
    - name: 'second: Check datafusion-substrait (physical)'
      run: cargo xtask ci step check datafusion-substrait physical
    - name: 'second: Install cmake'
      run: |
        # note the builder setup runs apt-get update / installs protobuf compiler
        apt-get install -y cmake
    - name: 'second: Check datafusion-substrait (protoc)'
      run: cargo xtask ci step check datafusion-substrait protoc
