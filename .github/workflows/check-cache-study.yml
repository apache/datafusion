name: Cargo check cache study
'on':
  push:
    branches:
    - db/ci-check-cache-measure
permissions:
  contents: read
concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Prepare identical check artifacts and cache
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
    steps:
    - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: 375bf976f58831cb438422c804045289af119870
    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-builder
      with:
        rust-version: stable
    - name: Record fixed environment
      run: |-
        git rev-parse HEAD
        rustc -Vv
        cargo -V
        nproc
        lscpu
        sha256sum Cargo.lock
    - name: Rust Dependency Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      with:
        shared-key: check-cache-study-v1
        save-if: true
      id: seed-cache
    - name: Prepare cargo build
      run: cargo xtask ci step check workspace
    - name: Archive Cargo check artifacts
      id: archive-check
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/cargo-check"
        # Preserve source timestamps so Cargo can reuse workspace crates.
        git ls-files -z | tar --null -T - -cf "$RUNNER_TEMP/cargo-check/check-workspace.tar" target
        # -C incremental=false creates per-crate caches named "false".
        tar --anchored --no-wildcards-match-slash \
          --exclude='registry/src/*/*/false' \
          -cf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME" registry
    - name: Upload Cargo check artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: cargo-check
        path: ${{ runner.temp }}/cargo-check/
        compression-level: 1
        retention-days: 1
        if-no-files-found: error
        overwrite: true
  datafusion:
    name: datafusion / same-runner comparison
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: amd64/rust
    env:
      CARGO_INCREMENTAL: '0'
    steps:
