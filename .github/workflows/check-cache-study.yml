    - name: Setup Rust toolchain
      uses: ./.github/actions/setup-builder
      with:
        rust-version: stable
    - name: Record fixed environment
      run: |-
        git rev-parse HEAD
        rustc -Vv
        cargo -V
        nproc
        lscpu
        sha256sum Cargo.lock
    - name: artifact-first / Reset build data
      run: |-
        git reset --hard 375bf976f58831cb438422c804045289af119870
        git clean -ffdx
        rm -rf "$CARGO_HOME/registry" "$CARGO_HOME/git"
        test ! -e target
        test ! -e "$CARGO_HOME/registry"
      if: github.run_attempt == '1'
    - name: artifact-first / Download artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: cargo-check
        path: ${{ runner.temp }}/cargo-check
      if: github.run_attempt == '1'
    - name: artifact-first / Restore artifact
      run: |-
        tar -xf "$RUNNER_TEMP/cargo-check/check-workspace.tar"
        tar -xf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME"
