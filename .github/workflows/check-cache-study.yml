name: Cargo cache study

on:
  workflow_dispatch:
  push:
    branches: [db/ci-opts]
    paths:
      - .github/workflows/check-cache-study.yml
      - ci/scripts/cache_study.py

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-cache-study
  cancel-in-progress: true

jobs:
  cold:
    name: cold / ${{ matrix.cache }} / ${{ matrix.trial }}
    if: github.repository == 'apache/datafusion' && vars.USE_RUNS_ON == 'true'
    runs-on: &runner ${{ format('runs-on={0},family=m8a,cpu=16,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id) }}
    container: &container
      image: amd64/rust
    timeout-minutes: 45
    strategy: &strategy
      fail-fast: false
      matrix:
        cache: [rust-cache, sccache, hybrid]
        trial: [1, 2]
    env: &environment
      CACHE_STUDY_BACKEND: ${{ matrix.cache }}
      CACHE_STUDY_TRIAL: ${{ matrix.trial }}
      CARGO_TERM_COLOR: never
    steps: &steps
      - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670 # v2.7.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout test data
        uses: ./.github/actions/checkout-test-data
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
      - name: Install coverage tools
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@4a76afe23f9e08d2d9550fb56e556444e8611d21 # v2.90.4
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Record environment
        run: |
          mkdir -p "$RUNNER_TEMP/cache-study"
          {
            git rev-parse HEAD
            rustc -vV
            cargo llvm-cov --version
            lscpu
            sha256sum Cargo.lock
            printf 'RUSTFLAGS=%s\n' "$RUSTFLAGS"
            printf 'CARGO_HOME=%s\n' "$CARGO_HOME"
          } | tee "$RUNNER_TEMP/cache-study/environment.txt"
      - name: Restore Rust cache
        id: rust-cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: study-${{ github.run_id }}-${{ github.run_attempt }}
          shared-key: ${{ matrix.cache }}-${{ matrix.trial }}
          cache-targets: ${{ matrix.cache != 'sccache' }}
          cache-bin: false
          save-if: ${{ github.job == 'cold' }}
      - name: Verify cache state
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          if [ "$GITHUB_JOB" = cold ]; then
            test "$CACHE_HIT" = false
          else
            test "$CACHE_HIT" = true
          fi
      - name: Configure compiler cache
        if: matrix.cache != 'rust-cache'
        uses: ./.github/actions/setup-sccache
      - name: Isolate compiler cache
        if: matrix.cache != 'rust-cache'
        env:
          STUDY_PREFIX: cache/sccache/${{ github.repository_id }}/study/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.cache }}/${{ matrix.trial }}
        run: |
          sccache --stop-server || true
          printf 'SCCACHE_S3_KEY_PREFIX=%s\n' "$STUDY_PREFIX" >> "$GITHUB_ENV"
      - name: Compile coverage tests
        shell: bash
        run: |
          eval "$(cargo llvm-cov show-env --export-prefix)"
          python3 ci/scripts/cache_study.py
      - name: Compiler cache statistics
        if: always() && matrix.cache != 'rust-cache'
        run: |
          sccache --show-stats
          sccache --show-stats --stats-format json > "$RUNNER_TEMP/cache-study/sccache.json"
          sccache --stop-server
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: cache-study-${{ github.job }}-${{ matrix.cache }}-${{ matrix.trial }}
          path: ${{ runner.temp }}/cache-study
          retention-days: 7

  warm:
    name: warm / ${{ matrix.cache }} / ${{ matrix.trial }}
    needs: cold
    runs-on: *runner
    container: *container
    timeout-minutes: 45
    strategy: *strategy
    env: *environment
    steps: *steps

  changed:
    name: changed / ${{ matrix.cache }} / ${{ matrix.trial }}
    needs: warm
    runs-on: *runner
    container: *container
    timeout-minutes: 45
    strategy: *strategy
    env: *environment
    steps: *steps
