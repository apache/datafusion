# Each test command below is implemented with `cargo xtask` so developers can
# run the same suite locally. Append `--explain` to print the underlying
# `cargo test` invocation without running it. Job setup, the clean working tree
# check, and `cargo clean` remain in this workflow.
#
# See `xtask/README.md` for details about DataFusion's `xtask` tooling.
# Track progress at https://github.com/apache/datafusion/issues/24487.

name: Datafusion extended tests

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || inputs.pr_head_sha || github.sha }}-${{ github.workflow }}-${{ inputs.suite || 'all' }}
  cancel-in-progress: true

# Run these required checks in the merge queue before merging into main.
# On PR updates, skip the jobs so their required checks allow queue entry
# without running the expensive suites. Do not add pull_request path filters:
# a skipped workflow would leave required checks pending.
on:
  pull_request:
  merge_group:
  push:
    branches:
      # Release branches retain post-push coverage. main is covered by the
      # merge queue, so do not repeat the tests after merging.
      - 'branch-*'
  workflow_dispatch:
    inputs:
      pr_head_sha:
        description: 'PR head SHA'
        type: string
      suite:
        description: 'Test suite'
        type: choice
        default: all
        options:
          - all
          - extended
          - hash-collisions
          - sqlite

permissions:
  contents: read
  checks: write

jobs:
  # Run extended tests (with feature 'extended_tests')
  linux-test-extended:
    name: cargo test 'extended_tests' (amd64)
    # Long-running job: run in the merge queue, on release pushes, or manually.
    if: github.event_name != 'pull_request' && (!inputs.suite || inputs.suite == 'all' || inputs.suite == 'extended')
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a+m7a+c8a,cpu=32,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id) || 'ubuntu-latest' }}
    # note: do not use amd/rust container to preserve disk space
    steps:
      - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670  # v2.7.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.pr_head_sha }} # otherwise use the event's commit, including the merge group
          fetch-depth: 1
      - name: Checkout test data
        if: hashFiles('.github/actions/checkout-test-data/action.yaml') != ''
        uses: ./.github/actions/checkout-test-data
      - name: Checkout test data for older revisions
        if: hashFiles('.github/actions/checkout-test-data/action.yaml') == ''
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule sync -- testing parquet-testing
          git submodule update --init --depth=1 testing parquet-testing
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
      - parallel:
          - name: Install Rust
            run: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env
              rustup toolchain install
          - name: Install Protobuf Compiler
            run: |
              sudo apt-get update
              sudo apt-get install -y protobuf-compiler
      - &runner-details
        name: Show runner and Rust details
        if: github.event_name == 'workflow_dispatch'
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          if command -v lscpu >/dev/null; then lscpu; else cat /proc/cpuinfo; fi
          cat /proc/meminfo
          for file in /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpuset.cpus.effective /sys/fs/cgroup/memory.max; do
            if test -f "$file"; then printf '%s: ' "$file"; cat "$file"; fi
          done
          rustc -vV
          printf 'RUST_BACKTRACE=%s\n' "${RUST_BACKTRACE-<unset>}"
          printf 'RUSTFLAGS=%s\n' "${RUSTFLAGS-<unset>}"
          printf 'CARGO_ENCODED_RUSTFLAGS=%s\n' "${CARGO_ENCODED_RUSTFLAGS-<unset>}"
          printf 'CARGO_BUILD_JOBS=%s\n' "${CARGO_BUILD_JOBS-<unset>}"
      # For debugging, test binaries can be large.
      - name: Show available disk space
        run: |
          df -h
      # Give the longest-running suite the build lock before the other Cargo commands.
      - name: Build extended tests
        if: vars.USE_RUNS_ON == 'true'
        shell: bash
        run: |
          extended_test_binary="$(cargo xtask ci step test extended-build |
            jq -r 'select(.reason == "compiler-artifact" and .target.name == "extended_tests" and .executable != null) | .executable')"
          test -x "$extended_test_binary"
          xtask_binary="${CARGO_TARGET_DIR:-target}/debug/datafusion-xtask"
          test -x "$xtask_binary"
          printf 'EXTENDED_TEST_BINARY=%s\n' "$extended_test_binary" >> "$GITHUB_ENV"
          printf 'XTASK_BINARY=%s\n' "$xtask_binary" >> "$GITHUB_ENV"
      - parallel:
          - name: Run extended tests
            if: vars.USE_RUNS_ON == 'true'
            # Invoke the built xtask directly so Cargo cannot wait on a fuzz build.
            run: '"$XTASK_BINARY" ci step test extended --binary "$EXTENDED_TEST_BINARY"'
          - name: Run fuzz tests
            if: vars.USE_RUNS_ON == 'true'
            run: cargo xtask ci step test fuzz
          # Migrate it to the above unified fuzz runner over time
          # Tracker: https://github.com/apache/datafusion/issues/27082
          - name: Run unmigrated fuzzers with more iterations
            if: vars.USE_RUNS_ON == 'true'
            run: cargo xtask ci step test fuzz-legacy
      - name: Run extended tests
        if: vars.USE_RUNS_ON != 'true'
        run: cargo xtask ci step test extended
      - name: Run fuzz tests
        if: vars.USE_RUNS_ON != 'true'
        run: cargo xtask ci step test fuzz
      - name: Run unmigrated fuzzers with more iterations
        if: vars.USE_RUNS_ON != 'true'
        run: cargo xtask ci step test fuzz-legacy
      - parallel:
          - name: Verify Working Directory Clean
            run: git diff --exit-code
          - name: Cleanup
            run: cargo clean

  # Check answers are correct when hash values collide
  hash-collisions:
    name: cargo test hash collisions (amd64)
    # Long-running job: run in the merge queue, on release pushes, or manually.
    if: github.event_name != 'pull_request' && (!inputs.suite || inputs.suite == 'all' || inputs.suite == 'hash-collisions')
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a+m7a+c8a,cpu=16,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id) || 'ubuntu-latest' }}
    container:
      image: amd64/rust
    steps:
      - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670  # v2.7.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.pr_head_sha }} # otherwise use the event's commit, including the merge group
          fetch-depth: 1
      - name: Checkout test data
        uses: ./.github/actions/checkout-test-data
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
      - name: Run tests
        run: |
          cargo xtask ci step test hash-collisions
          cd datafusion
          cargo clean

  sqllogictest-sqlite:
    name: "Run sqllogictests with the sqlite test suite"
    # Long-running job: run in the merge queue, on release pushes, or manually.
    if: github.event_name != 'pull_request' && (!inputs.suite || inputs.suite == 'all' || inputs.suite == 'sqlite')
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a+m7a+c8a,cpu=32,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id) || 'ubuntu-latest' }}
    container:
      image: amd64/rust
    steps:
      - uses: runs-on/action@4a3bfc79f21a9b97e972e2ba75a2b0b1e9688670  # v2.7.1
      - parallel:
          - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
            with:
              ref: ${{ github.event.inputs.pr_head_sha }} # otherwise use the event's commit, including the merge group
              submodules: true
              fetch-depth: 1
          # Don't use setup-builder to avoid configuring RUST_BACKTRACE which is expensive
          - name: Install protobuf compiler
            run: |
              apt-get update && apt-get install -y protobuf-compiler
      - *runner-details
      - name: Run sqllogictest
        run: cargo xtask ci step test sqlite
