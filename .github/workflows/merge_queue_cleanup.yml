name: Merge queue cleanup

on:
  # A replacement group starts cleanup promptly; the sweep also catches groups
  # removed without a replacement and runs that appear after an earlier scan.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report obsolete runs without cancelling them"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write

# Every invocation scans all active merge-group runs, so a newer pending
# invocation can safely replace an older pending one. Do not interrupt a scan.
concurrency:
  group: merge-queue-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'apache/datafusion'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Cancel obsolete merge-group runs
        # During the PR that introduces this workflow, main has no script yet.
        # Always execute main's script, never code from the merge group.
        if: hashFiles('ci/scripts/cancel_merge_queue_runs.cjs') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        with:
          script: |
            const { run } = require('./ci/scripts/cancel_merge_queue_runs.cjs');
            const dryRun = process.env.DRY_RUN !== 'false';
            const results = await run({ github, context, core, dryRun });
            await core.summary
              .addHeading(dryRun ? 'Would cancel merge-group runs' : 'Requested merge-group cancellations')
              .addTable([
                [{ data: 'Run', header: true }, { data: 'Reason', header: true }],
                ...results.map(({ id, reason }) => [String(id), reason]),
              ])
              .write();
