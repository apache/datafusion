# Temporary branch-only workflow for CI timing experiments. Remove before merging.
name: CI optimization experiment

on:
  push:
    branches:
      - 'db/ci-opts'

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  linux-build-lib:
    name: linux build test
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork && github.base_ref == 'main') }}
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a+m7a+c8a,cpu=8,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id) || 'ubuntu-latest' }}
    container:
      image: amd64/rust
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc  # v2.7.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: "amd-ci-check" # Keep cargo check artifacts separate from test builds.
          save-if: ${{ github.ref_name == 'main' }}
      - name: Prepare cargo build
        # `--locked` asserts that Cargo.lock is up to date with the manifest.
        run: cargo xtask ci step check workspace
      - name: Archive Cargo check artifacts
        id: archive-check
        if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'apache/datafusion') }}
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cargo-check"
          # Preserve source timestamps so Cargo can reuse workspace crates.
          git ls-files -z | tar --null -T - -cf "$RUNNER_TEMP/cargo-check/check-workspace.tar" target
          # -C incremental=false creates per-crate caches named "false".
          tar --anchored --no-wildcards-match-slash \
            --exclude='registry/src/*/*/false' \
            -cf "$RUNNER_TEMP/cargo-check/check-registry.tar" -C "$CARGO_HOME" registry
      - name: Upload Cargo check artifacts
        if: ${{ steps.archive-check.outcome == 'success' && !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'apache/datafusion') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: cargo-check
          path: ${{ runner.temp }}/cargo-check/
          compression-level: 1
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  linux-test:
    name: cargo test (amd64)
    needs: linux-build-lib
    if: false # Resume after the extended/fuzz experiments.
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a+m7a+c8a,cpu=16,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id) || 'ubuntu-latest' }}
    container:
      image: amd64/rust
      volumes:
        - /usr/local:/host/usr/local
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc  # v2.7.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-builder
        with:
          rust-version: stable
      - name: Checkout test data
        # datafusion-testing is used only with --include-sqlite.
        run: git submodule update --init --depth=1 testing parquet-testing
      - name: Install llvm-tools-preview
        run: rustup component add llvm-tools-preview
      - name: Install Python
        run: ci/scripts/retry timeout 120 apt-get install -y python3
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2.90.2
        with:
          tool: cargo-llvm-cov
      - name: Rust Dependency Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          save-if: ${{ github.ref_name == 'main' }}
          shared-key: "amd-ci"
      # Restore before sccache sets RUSTC_WRAPPER, which changes rust-cache's key.
      - name: Configure compiler cache
        if: vars.USE_RUNS_ON == 'true'
        uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc  # v2.7.0
        with:
          sccache: s3
      - name: Install sccache
        id: sccache
        if: vars.USE_RUNS_ON == 'true'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2  # v2.90.2
        with:
          tool: sccache@0.19.0
      - name: Run tests with workspace and SQLLogicTest coverage
        run: cargo xtask ci step test workspace
      - name: Report compiler cache statistics
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: sccache --show-stats
      - parallel:
          - name: Verify Working Directory Clean
            run: git diff --exit-code
          # Check no temporary directories created during test.
          # `false/` folder is excuded for rust cache.
          - name: Verify Working Directory Clean (No Untracked Files)
            run: |
              STATUS="$(git status --porcelain | sed -e '/^?? false\/$/d' -e '/^?? false$/d')"
              if [ -n "$STATUS" ]; then
                echo "$STATUS"
                exit 1
              fi
      - name: Upload all-test coverage to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: target/codecov.json
          flags: all-tests
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload SQLLogicTest coverage to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: target/codecov-slt.json
          flags: sqllogictests
          disable_search: true
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  linux-test-extended:
    name: cargo test 'extended_tests' (amd64)
    needs: linux-build-lib
    # Long-running job: run in the merge queue, on release pushes, or manually.
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.USE_RUNS_ON == 'true' && format('runs-on={0},family=m8a+m7a+c8a,cpu=32,image=ubuntu24-full-x64,extras=s3-cache,disk=large,tag=datafusion', github.run_id) || 'ubuntu-latest' }}
    # note: do not use amd/rust container to preserve disk space
    steps:
      - uses: runs-on/action@13fbb6a39310a0dac9ab4716da2c4e74a3326dfc  # v2.7.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.inputs.pr_head_sha }} # otherwise use the event's commit, including the merge group
          submodules: true
          fetch-depth: 1
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6  # v2.0.0
      - parallel:
          - name: Install Rust
            run: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source $HOME/.cargo/env
              rustup toolchain install
          - name: Install Protobuf Compiler
            run: |
              sudo apt-get update
              sudo apt-get install -y protobuf-compiler
      # For debugging, test binaries can be large.
      - name: Show available disk space
        run: |
          df -h
      - name: Run extended tests
        run: cargo xtask ci step test extended
      - name: Run fuzz tests
        run: cargo xtask ci step test fuzz
      # Migrate it to the above unified fuzz runner over time
      # Tracker: https://github.com/apache/datafusion/issues/27082
      - name: Run unmigrated fuzzers with more iterations
        run: cargo xtask ci step test fuzz-legacy
      - parallel:
          - name: Verify Working Directory Clean
            run: git diff --exit-code
          - name: Cleanup
            run: cargo clean
