[package]
name = "datafusion-cli"
description = "Command Line Client for DataFusion query engine."
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

[package.metadata.docs.rs]
all-features = true

[features]
default = []
backtrace = ["datafusion/backtrace"]

[dependencies]
arrow = { workspace = true }
async-trait = { workspace = true }
aws-config = "1.8.18"
aws-credential-types = "1.2.13"
chrono = { workspace = true }
clap = { version = "4.5.60", features = ["cargo", "derive"] }
datafusion = { workspace = true, features = [
    "avro",
    "compression",
    "crypto_expressions",
    "datetime_expressions",
    "encoding_expressions",
    "nested_expressions",
    "parquet",
    "parquet_encryption",
    "recursive_protection",
    "regex_expressions",
    "sql",
    "unicode_expressions",
] }
datafusion-common = { workspace = true }
dirs = "7.0.0"
env_logger = { workspace = true }
futures = { workspace = true }
log = { workspace = true }
mimalloc = { version = "0.1", default-features = false }
object_store = { workspace = true, features = ["aws", "gcp", "http"] }
parking_lot = { workspace = true }
parquet = { workspace = true, default-features = false }
regex = { workspace = true }
rustyline = "19.0"
tokio = { workspace = true, features = ["macros", "parking_lot", "rt", "rt-multi-thread", "signal", "sync"] }
url = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
ctor = { workspace = true }
insta = { workspace = true }
insta-cmd = "0.7.0"
rstest = { workspace = true }
testcontainers-modules = { workspace = true }
# Makes sure `test_display_pg_json` behaves in a consistent way regardless of
# feature unification with dependencies
serde_json = { workspace = true, features = ["preserve_order"] }

# serde_json is pulled with a feature to get
# consistent pg display, but is not directly used in this crate.
[package.metadata.cargo-machete]
ignored = ["serde_json"]
