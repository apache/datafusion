[package]
name = "datafusion-examples"
description = "DataFusion usage examples"
keywords = ["arrow", "query", "sql"]
publish = false
readme = "README.md"
version = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
rust-version = { workspace = true }

# Note: add additional linter rules in lib.rs.
# Rust does not support workspace + new linter rules in subcrates yet
# https://github.com/rust-lang/cargo/issues/13157
[lints]
workspace = true

[features]
# Runs the examples that convert plans and expressions back to SQL
unparser = ["datafusion/unparser"]

[dependencies]
arrow = { workspace = true }
arrow-schema = { workspace = true }
# note: only use the main datafusion crate for examples
datafusion = { workspace = true, default-features = true, features = ["parquet_encryption"] }
nom = "8.0.0"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "parking_lot", "fs"] }

[dev-dependencies]
arrow-flight = { workspace = true }
async-trait = { workspace = true }
base64 = "0.23.0"
bytes = { workspace = true }
dashmap = { workspace = true }
datafusion-proto = { workspace = true, features = ["parquet"] }
env_logger = { workspace = true }
futures = { workspace = true }
insta = { workspace = true }
log = { workspace = true }
mimalloc = { version = "0.1", default-features = false }
object_store = { workspace = true, features = ["aws", "fs", "http"] }
prost = { workspace = true }
rand = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
test-utils = { path = "../test-utils" }
tonic = "0.14"
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
url = { workspace = true }
uuid = { workspace = true }

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
nix = { version = "0.31.3", features = ["fs"] }
